# scrubberd on OpenShift — MinIO-driven log sanitizer service.
#
# Prereqs (create BEFORE applying this file):
#   1. oc create secret generic scrubber-secret \
#        --from-literal=MINIO_ACCESS_KEY='<key>' \
#        --from-literal=MINIO_SECRET_KEY='<secret>'
#   2. Put your named policy files in a ConfigMap (each *.json = one policy):
#        oc create configmap scrubber-policies \
#          --from-file=default.json=./policies/default.json \
#          --from-file=strict.json=./policies/strict.json
#   3. (optional, if MinIO uses a private CA)
#        oc create configmap scrubber-ca --from-file=minio-ca.crt=./minio-ca.crt
#   4. (if pulling from Artifactory) oc create secret docker-registry artifactory-pull ...
# Then edit the <PLACEHOLDERS> below and:  oc apply -f openshift-manifests.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrubber-config
  labels: { app: scrubberd }
data:
  MINIO_ENDPOINT: "<MINIO_HOST>:9000"
  MINIO_USE_TLS: "true"
  # MINIO_CA_CERT: "/etc/scrubber/ca/minio-ca.crt"   # uncomment if using scrubber-ca
  INPUT_BUCKET: "scrub-input"
  OUTPUT_BUCKET: "scrub-output"
  REPORTS_BUCKET: "scrub-reports"
  # INPUT_PREFIX: ""
  DEFAULT_POLICY: "default"
  # Map an input key prefix to a named policy (JSON object), highest-specificity wins:
  PREFIX_POLICY_MAP: '{"secure/":"strict"}'
  PROCESSED_ACTION: "move"        # move (to processed/) or delete
  # How often the input bucket is listed for NEW work. It does NOT govern the drain
  # rate: the queue hands the next object to the consumer the instant it finishes
  # one. The API also nudges a listing when a browser starts polling a key the
  # worker has not seen yet, so a fresh upload is picked up within a second or two
  # without polling harder. Listing covers the whole input bucket including
  # processed/, so shortening this gets more expensive as that prefix grows.
  POLL_INTERVAL: "15s"
  # Memory and scratch storage.
  #
  # Objects are scrubbed one at a time, and archive members SPILL TO DISK: only the
  # member being scrubbed right now is on the heap. Before that, every member body,
  # every scrubbed replacement and the repacked container were live at once, so
  # resident memory was a multiple of the bundle size and a few-hundred-MiB upload
  # could not fit this pod at any cap. It now can.
  #
  # The consequence is that MAX_EXPAND_BYTES bounds mostly DISK, not memory. Size the
  # /work emptyDir against it — an ephemeral-storage eviction kills a pod exactly as
  # dead as an OOM, and an unbounded emptyDir draws on node storage shared with every
  # other pod on the node.
  #
  # Resident memory is now governed by the two SPILL_* settings below, NOT by
  # MAX_EXPAND_BYTES. Verify any change with ./scripts/memory-matrix.sh, which runs
  # the worst-shaped bundle end to end and fails if peak RSS exceeds 60% of the limit
  # OR if the object comes back with a passthrough — a cap set too low stops bounding
  # anything and starts silently emitting unscrubbed files, which looks like a pass
  # if you only watch memory.
  WORKERS: "1"                    # queue concurrency. Kept for config compatibility
                                  # and CLAMPED to 1 -- a higher value is ignored
                                  # (with a warning) because concurrent scrubs on a
                                  # single CPU only slow each other down and would
                                  # multiply the memory budget above.
  QUEUE_MAX: "10000"              # cap on the in-memory pending set. Anything beyond
                                  # it stays in the bucket and is picked up later;
                                  # the service warns when it truncates.
  # How long the in-flight object may sit in ONE phase before the worker starts
  # logging that it may be stalled rather than slow. A log threshold, never a
  # kill: a large bundle legitimately spends minutes in one phase. Pair it with an
  # alert on scrubber_inflight_phase_seconds, which is the same signal as a metric.
  STALL_WARN_AFTER: "5m"
  # Abandon an object-storage transfer that has moved NO bytes for this long, and
  # bound the metadata calls (10x this for listings, which paginate). This is not
  # a deadline on the transfer: a large object over a congested link legitimately
  # takes minutes, and a deadline generous enough to allow that is too generous to
  # catch a hang. What separates the two is whether anything is still arriving.
  # Without it a connection that goes quiet mid-body blocks the single consumer
  # forever, with the pod live and ready throughout.
  TRANSFER_STALL_TIMEOUT: "60s"
  # Total object-storage time ONE HTTP request may spend, shared by every call it
  # makes. The per-call bound above stops any single call hanging; it says nothing
  # about their sum, and a status poll makes up to three in series while a history
  # page fans out to HISTORY_MAX reads. The browser repeats these every second, so
  # a fast degraded answer beats a slow true one.
  API_STORAGE_BUDGET: "5s"
  # Bound on ONE bucket listing. Separate from the stall timeout because a
  # listing's honest duration scales with the bucket -- it paginates, and the
  # input bucket includes processed/ -- rather than with the network. It used to
  # be derived as 10x the stall timeout, which put it at ten minutes by default:
  # long enough that a dead backend looked idle rather than broken.
  LIST_TIMEOUT: "90s"
  # Withdrawing a package from the queue. The queue is strict FCFS with a single
  # consumer, so one object that cannot make progress holds up everyone behind it;
  # this is the escape hatch, surfaced as a Withdraw button on each upload card.
  #
  # A cancel must present the token /api/uploads minted for that exact key. That
  # is not authentication -- the browser API has none -- but it scopes the endpoint
  # to keys the caller was handed rather than to every key /api/queue and
  # /api/history print.
  ALLOW_CANCEL: "true"
  # Removes that scoping, so ANY caller can withdraw ANY key. This is the operator
  # path for clearing somebody else's stuck object. DO NOT enable it without real
  # authentication in front of the Route: with no auth it is a two-line loop that
  # durably evacuates the queue for every user.
  ALLOW_CANCEL_ANY: "false"
  # Where a withdrawn input is moved under PROCESSED_ACTION=move. Withdrawing does
  # not destroy the upload: it is the user's own copy of logs they were preparing
  # to send out, and the usual reason to withdraw is that it is stuck. Under
  # PROCESSED_ACTION=delete a cancel deletes, honouring your retention policy.
  # Must never be empty -- "" is a prefix of every key, which would make the whole
  # input bucket ineligible and silently stop all scrubbing.
  CANCELLED_PREFIX: "cancelled/"
  # Storage time one cancel may take. Larger than API_STORAGE_BUDGET because the
  # withdrawal is a server-side copy of a possibly large object.
  CANCEL_BUDGET: "60s"
  FINALIZE_GRACE: "15s"           # on shutdown, how long an object that has already
                                  # finished scrubbing may keep writing its output,
                                  # report and digest. Without this a SIGTERM lands
                                  # mid-object and discards a completed scrub, which
                                  # then has to be redone after the restart. Keep it
                                  # inside terminationGracePeriodSeconds below.
  # SCRATCH_BYTES declares how much scratch one object may use, and MUST match the
  # /work emptyDir sizeLimit at the bottom of this file. It cannot be detected:
  # an emptyDir's sizeLimit is enforced by the kubelet, not the filesystem, so
  # statfs inside the container reports the whole node's disk and would license a
  # budget that gets the pod evicted.
  #
  # MAX_EXPAND_BYTES and MAX_OBJECT_BYTES are derived from it (expansion =
  # SCRATCH_BYTES / 2.5, object = 41.7% of that, the ratios the shipped numbers
  # were measured at). Set either one explicitly below to override the derivation.
  SCRATCH_BYTES: "4294967296"     # 4Gi — keep equal to the /work sizeLimit
  # MAX_OBJECT_BYTES: "671088640"   # 640Mi compressed input. Larger objects are
                                  # skipped without being downloaded whole and
                                  # counted in scrubber_objects_total{status=
                                  # "too_large"}. Watch that counter: it is how you
                                  # find out real uploads are being turned away.
                                  # Raised from 64Mi, which rejected ordinary
                                  # bundles outright before the spill made them
                                  # processable.
  # MAX_EXPAND_BYTES: "1610612736"  # 1536Mi cumulative decompressed bytes per object,
                                  # enforced *while* reading so it is a real budget
                                  # rather than a ratio heuristic. Members spill, so
                                  # this is now a DISK bound: keep the /work
                                  # sizeLimit comfortably above it.
                                  # NOTE: a .tar.gz draws on this budget twice --
                                  # once for the decompressed tar, once for the
                                  # member bodies read out of it. Effective capacity
                                  # for a tar.gz is therefore ~768Mi of content.
  # The two SPILL_* settings and GOMEMLIMIT are now DERIVED from the pod's own
  # memory limit, read from the cgroup at startup. The values below are what a
  # 2Gi pod derives; a 4Gi pod gets double and an 8Gi pod quadruple, with no edit
  # here. They are left commented rather than deleted because setting either one
  # explicitly is still the override — and note that doing so freezes it: a
  # hard-coded SPILL_RESIDENT_MAX is exactly what stopped the service using a
  # larger pod, and raising it far enough to matter turns spilling off and brings
  # back the OOM the spill exists to prevent. Prefer changing limits.memory.
  # SPILL_THRESHOLD: "4194304"      # 4Mi. Payloads larger than this go to /work on
                                  # their own. Below it they stay on the heap, which
                                  # keeps a 20000-member archive from creating 20000
                                  # files.
  # SPILL_RESIDENT_MAX: "67108864"  # 64Mi aggregate in-memory budget. This is the one
                                  # that catches many-small-members bundles: each
                                  # payload is individually under the threshold while
                                  # together they would hold the whole archive. Once
                                  # this is exceeded everything spills regardless of
                                  # size. THIS, not MAX_EXPAND_BYTES, is what bounds
                                  # resident memory now.
  SCRUB_FILENAMES: "true"         # also scrub archive member names/paths + output key
  # Reports live in an internal bucket for operators to verify the scrub, so they
  # show the actual original values by default. Set "true" to store salted hashes
  # instead if the reports bucket is less trusted than the operators.
  REDACT_REPORTS: "false"
  MAX_DEPTH: "16"
  MAX_MEMBERS: "100000"
  # MAX_RATIO is gone. An expansion-ratio limit cannot tell a decompression bomb
  # from an ordinary log file (logs routinely compress 200:1 and beyond), and
  # tripping it emitted the object UNSCRUBBED. Use MAX_EXPAND_BYTES instead.
  # Number of past runs the UI may request from /api/history.
  HISTORY_MAX: "100"
  # debug logs a line per file inside every bundle as it is scrubbed.
  LOG_LEVEL: "info"
  PORT: "8080"
  # Let the Go GC know the container ceiling so it collects harder as it nears it
  # rather than being OOM-killed. Keep this below limits.memory.
  #
  # This is a soft target the GC grows the heap *toward*, so it sets the steady-state
  # RSS as much as it caps it. It only holds while the LIVE set fits underneath: before
  # members spilled, at MAX_EXPAND_BYTES=512Mi the live set exceeded 1600MiB, the GC
  # could not keep up, and RSS overran to 1889Mi -- 92% of this pod.
  #
  # Now that the live set is bounded by the SPILL_* settings rather than by the bundle,
  # the measured peak is 445Mi (22% of the limit) with this target, across both worst
  # shapes: 90000 tiny members and a 500Mi incompressible bundle. This is the value
  # ./scripts/memory-matrix.sh measured at; change it and re-run that script.
  # GOMEMLIMIT: "1200MiB"          # derived as 58.6% of the detected pod memory
  # Web UI: browser uploads straight to MinIO via presigned URLs, so the browser
  # must be able to reach MinIO. Set these to MinIO's externally reachable host.
  # (MinIO also needs CORS allowing the scrubber Route origin.)
  MINIO_PUBLIC_ENDPOINT: "<MINIO_PUBLIC_HOST>"
  MINIO_PUBLIC_TLS: "true"
  UPLOAD_EXPIRY: "15m"
  # Allow operators to edit/upload the policy from the UI (PUT /api/policy). Live
  # edits are in-memory only; durable changes go through the scrubber-policies
  # ConfigMap. Set "false" to make the policy read-only from the UI.
  ALLOW_POLICY_EDIT: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrubberd
  labels: { app: scrubberd }
spec:
  replicas: 1            # single replica: the FCFS queue is per-pod, and there is no
                         # distributed object-claim, so two pods would both list the
                         # same bucket and double-process objects.
  # Recreate, NOT the default RollingUpdate. With replicas: 1 the defaults work out
  # to maxSurge=1 / maxUnavailable=0, so a rollout starts the new pod BEFORE
  # terminating the old one -- two scrubberds polling the same input bucket, each
  # with its own queue, for the length of the rollout. Recreate stops the old pod
  # first, at the cost of a short gap in service.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: scrubberd }
  template:
    metadata:
      labels: { app: scrubberd }
    spec:
      # Long enough for the HTTP drain plus FINALIZE_GRACE, so an object that has
      # finished scrubbing gets its result persisted instead of being killed and
      # redone. The default 30s leaves no room once the server drain is counted.
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: artifactory-pull   # only if pulling from a private Artifactory repo
      containers:
        - name: scrubberd
          image: <ARTIFACTORY_DOCKER_HOST>/docker-local/scrubberd:0.6.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: scrubber-config }
            - secretRef: { name: scrubber-secret }
          volumeMounts:
            - name: policies
              mountPath: /etc/scrubber/policies
              readOnly: true
            - name: work
              mountPath: /work
            # - name: ca
            #   mountPath: /etc/scrubber/ca
            #   readOnly: true
          # /readyz checks that MinIO is reachable (cached for a few seconds and
          # given its own deadline in-process, so a slow backend cannot make the
          # probe hang).
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # /healthz is a pure liveness signal and does no I/O. The generous
          # timeout and threshold matter: the default 1s timeout is easy to miss
          # while the process is under GC pressure scrubbing a large bundle, and
          # a restart there loses in-flight work.
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            # Sized from the MAX_OBJECT_BYTES + MAX_EXPAND_BYTES budget in the
            # ConfigMap above (one object at a time) -- change them together, never
            # one alone.
            # The CPU request matters more than it used to: with a single consumer,
            # the queue's drain rate IS the CPU share this pod gets when the node is
            # contended. 100m was conservative when work was spread over several
            # goroutines; now it directly throttles every upload in the queue.
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 2Gi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: policies
          configMap: { name: scrubber-policies }
        - name: work
          # sizeLimit is load-bearing now that archive members spill here. Without
          # it an emptyDir draws on node ephemeral storage shared with every other
          # pod, and exceeding it evicts this pod — the same outcome as an OOM, from
          # a different resource. Keep it comfortably above MAX_EXPAND_BYTES: a
          # .tar.gz stages the decompressed container, the member bodies and the
          # repacked result, so budget roughly 2.5x the expansion cap.
          emptyDir:
            sizeLimit: 4Gi
        # - name: ca
        #   configMap: { name: scrubber-ca }
---
apiVersion: v1
kind: Service
metadata:
  name: scrubberd
  labels: { app: scrubberd }
spec:
  type: ClusterIP
  selector: { app: scrubberd }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# External Route — serves the upload UI (/) + control plane + browser API
# (/api/uploads|status|downloads|policy, /metrics, /healthz, /readyz). The API only
# mints presigned URLs and returns label-only summaries; bundle bytes go directly
# browser <-> MinIO and never traverse this Route.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: scrubberd
  labels: { app: scrubberd }
spec:
  to:
    kind: Service
    name: scrubberd
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Optional: scrape /metrics via user-workload monitoring.
# apiVersion: monitoring.coreos.com/v1
# kind: ServiceMonitor
# metadata:
