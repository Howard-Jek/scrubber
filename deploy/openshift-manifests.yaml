# scrubberd on OpenShift — MinIO-driven log sanitizer service.
#
# Prereqs (create BEFORE applying this file):
#   1. oc create secret generic scrubber-secret \
#        --from-literal=MINIO_ACCESS_KEY='<key>' \
#        --from-literal=MINIO_SECRET_KEY='<secret>'
#   2. Put your named policy files in a ConfigMap (each *.json = one policy):
#        oc create configmap scrubber-policies \
#          --from-file=default.json=./policies/default.json \
#          --from-file=strict.json=./policies/strict.json
#   3. (optional, if MinIO uses a private CA)
#        oc create configmap scrubber-ca --from-file=minio-ca.crt=./minio-ca.crt
#   4. (if pulling from Artifactory) oc create secret docker-registry artifactory-pull ...
# Then edit the <PLACEHOLDERS> below and:  oc apply -f openshift-manifests.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrubber-config
  labels: { app: scrubberd }
data:
  MINIO_ENDPOINT: "<MINIO_HOST>:9000"
  MINIO_USE_TLS: "true"
  # MINIO_CA_CERT: "/etc/scrubber/ca/minio-ca.crt"   # uncomment if using scrubber-ca
  INPUT_BUCKET: "scrub-input"
  OUTPUT_BUCKET: "scrub-output"
  REPORTS_BUCKET: "scrub-reports"
  # INPUT_PREFIX: ""
  DEFAULT_POLICY: "default"
  # Map an input key prefix to a named policy (JSON object), highest-specificity wins:
  PREFIX_POLICY_MAP: '{"secure/":"strict"}'
  PROCESSED_ACTION: "move"        # move (to processed/) or delete
  # How often the input bucket is listed for NEW work. It does NOT govern the drain
  # rate: the queue hands the next object to the consumer the instant it finishes
  # one. The API also nudges a listing when a browser starts polling a key the
  # worker has not seen yet, so a fresh upload is picked up within a second or two
  # without polling harder. Listing covers the whole input bucket including
  # processed/, so shortening this gets more expensive as that prefix grows.
  POLL_INTERVAL: "15s"
  # Memory. Objects are scrubbed ONE AT A TIME, so only one is ever resident --
  # but the expansion BUDGET is not the same as resident memory, and treating it as
  # such is how this pod gets OOM-killed.
  #
  # The budget counts bytes *read*: MAX_OBJECT_BYTES (compressed input) plus
  # MAX_EXPAND_BYTES (everything decompressed out of it). Actual RSS holds much more
  # at the same instant -- every member's scrubbed output alongside its input, the
  # repacked archive, and heap the Go GC has not returned yet.
  #
  # The multiplier is not a constant: it depends on the SHAPE of the object, not just
  # its size. `go test ./internal/pipeline -run TestMemoryMatrix` measures peak heap
  # across container formats, member counts, match densities and compressibility.
  # Worst is NOT the few-large-members bundle most people reach for when testing by
  # hand -- it is many *tiny* members in a .tar.gz, where per-member overhead
  # dominates:
  #
  #     targz / 20000 tiny members / dense    11.6x content   <- worst
  #     targz / 8 large members / dense        8.3x
  #     targz / sparse / incompressible        6.0x
  #     bare tar / dense                       4.7x
  #     zip / dense                            4.4x
  #
  # Measured end to end on that worst shape (./scripts/memory-matrix.sh), all with the
  # same 3.8M-match fixture:
  #
  #     512Mi cap                    ->  1889Mi peak RSS   (92% of 2Gi -- shipped value, unsafe)
  #     192Mi cap, 163Mi drawn       ->  1244Mi            (61%)
  #     160Mi cap, 152Mi drawn       ->  1390Mi            (68%) -- before the report was bounded
  #     160Mi cap, 152Mi drawn       ->   775Mi            (38%) -- CURRENT
  #
  # The last two rows are the same workload. The 615Mi difference is entirely the
  # report: it retained every one of those 3.8M matches, which no expansion cap could
  # touch. See report.maxMatchesPerReport.
  #
  # Note the headroom that leaves. 775Mi against a 60% target of 1228Mi means this cap
  # could be raised — roughly 224Mi looks reachable — but do not do it on arithmetic
  # alone. Re-run ./scripts/memory-matrix.sh with the new value and let it decide.
  #
  # Size limits.memory against MAX_OBJECT_BYTES + ~5x MAX_EXPAND_BYTES, not against
  # the plain sum. The service logs both budget_bytes and est_peak_rss_bytes
  # at startup -- check est_peak_rss_bytes against limits.memory, not budget_bytes.
  #
  # Verify any change with ./scripts/memory-matrix.sh, which runs the worst shape end
  # to end and fails if peak RSS exceeds 60% of the limit OR if the object comes back
  # with a passthrough (a cap set too low stops bounding memory and starts silently
  # emitting unscrubbed files instead).
  #
  # Raising MAX_EXPAND_BYTES needs limits.memory raised with it. If this pod is fixed
  # at 2Gi, do NOT raise it.
  WORKERS: "1"                    # queue concurrency. Kept for config compatibility
                                  # and CLAMPED to 1 -- a higher value is ignored
                                  # (with a warning) because concurrent scrubs on a
                                  # single CPU only slow each other down and would
                                  # multiply the memory budget above.
  QUEUE_MAX: "10000"              # cap on the in-memory pending set. Anything beyond
                                  # it stays in the bucket and is picked up later;
                                  # the service warns when it truncates.
  FINALIZE_GRACE: "15s"           # on shutdown, how long an object that has already
                                  # finished scrubbing may keep writing its output,
                                  # report and digest. Without this a SIGTERM lands
                                  # mid-object and discards a completed scrub, which
                                  # then has to be redone after the restart. Keep it
                                  # inside terminationGracePeriodSeconds below.
  MAX_OBJECT_BYTES: "67108864"    # 64Mi compressed input; larger objects are
                                  # skipped without being downloaded whole and
                                  # counted in scrubber_objects_total{status=
                                  # "too_large"}. Watch that counter: it is how you
                                  # find out real uploads are being turned away.
  MAX_EXPAND_BYTES: "167772160"   # 160Mi cumulative decompressed bytes per object.
                                  # Enforced *while* reading, so this is a real
                                  # budget rather than a ratio heuristic -- but see
                                  # the memory note above: it bounds bytes READ, not
                                  # resident memory, which runs ~5x higher on the
                                  # worst shape. Lowered from 512Mi, which does not
                                  # fit this pod.
                                  # NOTE: a .tar.gz draws on this budget twice --
                                  # once for the decompressed tar, once for the
                                  # member bodies copied out of it (they really
                                  # are two copies in memory). Effective capacity
                                  # for a tar.gz is therefore ~80Mi of content.
                                  #
                                  # THE PRACTICAL CEILING: with these values a
                                  # bundle above roughly 80Mi of expanded content is
                                  # rejected. Raising the cap buys some of that back
                                  # (see the headroom note above), but not an order
                                  # of magnitude: the pipeline holds the input, the
                                  # decompressed container, every member body, every
                                  # scrubbed body and the repacked archive at once,
                                  # so a ~500Mi bundle cannot fit a 2Gi pod at any
                                  # cap. That needs members spilled to disk (/work is
                                  # already mounted for exactly this kind of use).
  SCRUB_FILENAMES: "true"         # also scrub archive member names/paths + output key
  # Reports live in an internal bucket for operators to verify the scrub, so they
  # show the actual original values by default. Set "true" to store salted hashes
  # instead if the reports bucket is less trusted than the operators.
  REDACT_REPORTS: "false"
  MAX_DEPTH: "16"
  MAX_MEMBERS: "100000"
  # MAX_RATIO is gone. An expansion-ratio limit cannot tell a decompression bomb
  # from an ordinary log file (logs routinely compress 200:1 and beyond), and
  # tripping it emitted the object UNSCRUBBED. Use MAX_EXPAND_BYTES instead.
  # Number of past runs the UI may request from /api/history.
  HISTORY_MAX: "100"
  # debug logs a line per file inside every bundle as it is scrubbed.
  LOG_LEVEL: "info"
  PORT: "8080"
  # Let the Go GC know the container ceiling so it collects harder as it nears it
  # rather than being OOM-killed. Keep this below limits.memory.
  #
  # This is a soft target the GC grows the heap *toward*, so it sets the steady-state
  # RSS as much as it caps it: the same object measured 1587Mi peak under a 1600MiB
  # target and 1394Mi under a 1200MiB one. It only holds while the LIVE set fits
  # underneath -- at MAX_EXPAND_BYTES=512Mi the live set exceeded 1600MiB, the GC
  # could not keep up, and RSS overran to 1889Mi. Move it together with the expansion
  # cap, never alone.
  GOMEMLIMIT: "900MiB"
  # Web UI: browser uploads straight to MinIO via presigned URLs, so the browser
  # must be able to reach MinIO. Set these to MinIO's externally reachable host.
  # (MinIO also needs CORS allowing the scrubber Route origin.)
  MINIO_PUBLIC_ENDPOINT: "<MINIO_PUBLIC_HOST>"
  MINIO_PUBLIC_TLS: "true"
  UPLOAD_EXPIRY: "15m"
  # Allow operators to edit/upload the policy from the UI (PUT /api/policy). Live
  # edits are in-memory only; durable changes go through the scrubber-policies
  # ConfigMap. Set "false" to make the policy read-only from the UI.
  ALLOW_POLICY_EDIT: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrubberd
  labels: { app: scrubberd }
spec:
  replicas: 1            # single replica: the FCFS queue is per-pod, and there is no
                         # distributed object-claim, so two pods would both list the
                         # same bucket and double-process objects.
  # Recreate, NOT the default RollingUpdate. With replicas: 1 the defaults work out
  # to maxSurge=1 / maxUnavailable=0, so a rollout starts the new pod BEFORE
  # terminating the old one -- two scrubberds polling the same input bucket, each
  # with its own queue, for the length of the rollout. Recreate stops the old pod
  # first, at the cost of a short gap in service.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: scrubberd }
  template:
    metadata:
      labels: { app: scrubberd }
    spec:
      # Long enough for the HTTP drain plus FINALIZE_GRACE, so an object that has
      # finished scrubbing gets its result persisted instead of being killed and
      # redone. The default 30s leaves no room once the server drain is counted.
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: artifactory-pull   # only if pulling from a private Artifactory repo
      containers:
        - name: scrubberd
          image: <ARTIFACTORY_DOCKER_HOST>/docker-local/scrubberd:0.2.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: scrubber-config }
            - secretRef: { name: scrubber-secret }
          volumeMounts:
            - name: policies
              mountPath: /etc/scrubber/policies
              readOnly: true
            - name: work
              mountPath: /work
            # - name: ca
            #   mountPath: /etc/scrubber/ca
            #   readOnly: true
          # /readyz checks that MinIO is reachable (cached for a few seconds and
          # given its own deadline in-process, so a slow backend cannot make the
          # probe hang).
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # /healthz is a pure liveness signal and does no I/O. The generous
          # timeout and threshold matter: the default 1s timeout is easy to miss
          # while the process is under GC pressure scrubbing a large bundle, and
          # a restart there loses in-flight work.
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            # Sized from the MAX_OBJECT_BYTES + MAX_EXPAND_BYTES budget in the
            # ConfigMap above (one object at a time) -- change them together, never
            # one alone.
            # The CPU request matters more than it used to: with a single consumer,
            # the queue's drain rate IS the CPU share this pod gets when the node is
            # contended. 100m was conservative when work was spread over several
            # goroutines; now it directly throttles every upload in the queue.
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { cpu: "1",  memory: 2Gi }
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: policies
          configMap: { name: scrubber-policies }
        - name: work
          emptyDir: {}
        # - name: ca
        #   configMap: { name: scrubber-ca }
---
apiVersion: v1
kind: Service
metadata:
  name: scrubberd
  labels: { app: scrubberd }
spec:
  type: ClusterIP
  selector: { app: scrubberd }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# External Route — serves the upload UI (/) + control plane + browser API
# (/api/uploads|status|downloads|policy, /metrics, /healthz, /readyz). The API only
# mints presigned URLs and returns label-only summaries; bundle bytes go directly
# browser <-> MinIO and never traverse this Route.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: scrubberd
  labels: { app: scrubberd }
spec:
  to:
    kind: Service
    name: scrubberd
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# Optional: scrape /metrics via user-workload monitoring.
