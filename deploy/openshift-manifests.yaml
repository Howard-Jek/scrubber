# scrubberd on OpenShift — MinIO-driven log sanitizer service.
#
# Prereqs (create BEFORE applying this file):
#   1. oc create secret generic scrubber-secret \
#        --from-literal=MINIO_ACCESS_KEY='<key>' \
#        --from-literal=MINIO_SECRET_KEY='<secret>'
#   2. Put your named policy files in a ConfigMap (each *.json = one policy):
#        oc create configmap scrubber-policies \
#          --from-file=default.json=./policies/default.json \
#          --from-file=strict.json=./policies/strict.json
#   3. (optional, if MinIO uses a private CA)
#        oc create configmap scrubber-ca --from-file=minio-ca.crt=./minio-ca.crt
#   4. (if pulling from Artifactory) oc create secret docker-registry artifactory-pull ...
# Then edit the <PLACEHOLDERS> below and:  oc apply -f openshift-manifests.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scrubber-config
  labels: { app: scrubberd }
data:
  MINIO_ENDPOINT: "<MINIO_HOST>:9000"
  MINIO_USE_TLS: "true"
  # MINIO_CA_CERT: "/etc/scrubber/ca/minio-ca.crt"   # uncomment if using scrubber-ca
  INPUT_BUCKET: "scrub-input"
  OUTPUT_BUCKET: "scrub-output"
  REPORTS_BUCKET: "scrub-reports"
  # INPUT_PREFIX: ""
  DEFAULT_POLICY: "default"
  # Map an input key prefix to a named policy (JSON object), highest-specificity wins:
  PREFIX_POLICY_MAP: '{"secure/":"strict"}'
  PROCESSED_ACTION: "move"        # move (to processed/) or delete
  # How often the input bucket is listed for NEW work. It does NOT govern the drain
  # rate: the queue hands the next object to the consumer the instant it finishes
  # one. The API also nudges a listing when a browser starts polling a key the
  # worker has not seen yet, so a fresh upload is picked up within a second or two
  # without polling harder. Listing covers the whole input bucket including
  # processed/, so shortening this gets more expensive as that prefix grows.
  POLL_INTERVAL: "15s"
  # Memory and scratch storage.
  #
  # Objects are scrubbed one at a time, and archive members SPILL TO DISK: only the
  # member being scrubbed right now is on the heap. Before that, every member body,
  # every scrubbed replacement and the repacked container were live at once, so
  # resident memory was a multiple of the bundle size and a few-hundred-MiB upload
  # could not fit this pod at any cap. It now can.
  #
  # -------------------------------------------------------------------------------
  # TWO CEILINGS, TWO RESOURCES. Read this before changing any number below.
  #
  #   How large a bundle may EXPAND      -> bounded by ephemeral storage (/work)
  #   How large one FILE may be SCRUBBED -> bounded by memory (limits.memory)
  #
  # They are not interchangeable, and swapping them fails in production rather than
  # at rollout. Every expanded byte lands on /work, so an expansion cap sized from
  # limits.memory gets the pod EVICTED for ephemeral-storage. One file must be
  # contiguous in memory for the matcher and that copy never touches disk, so a
  # per-file cap sized from the volume OOM-KILLS the pod.
  #
  # NOTHING here is compiled in any more. Both caps are DERIVED at startup from what
  # this file declares — the resources block and the /work sizeLimit at the bottom,
  # projected into the pod by the Downward API env vars in the Deployment. Raise the
  # declaration and the caps follow on the next rollout, with no code change.
  #
  # And note what "too large" does -- three different things, worth keeping apart:
  #
  #   MAX_OBJECT_BYTES   the only one that REJECTS. The upload is turned away and
  #                      counted in scrubber_objects_total{status="too_large"}.
  #   MAX_EXPAND_BYTES   the whole container is emitted UNSCRUBBED, flagged
  #                      guard-tripped / expansion-budget. EVERY member of it is
  #                      uninspected, not just the one that overran.
  #   MAX_LEAF_BYTES     only THAT FILE is emitted unscrubbed, flagged
  #                      guard-tripped / leaf-cap. The rest of the archive is
  #                      scrubbed normally.
  #
  # In the last two the object still lands in the output bucket, with verdict
  # "incomplete". Alert on scrubber_files_not_inspected_total by reason, not just on
  # the error counters -- nothing errored.
  # -------------------------------------------------------------------------------
  #
  # Verify any change with ./scripts/memory-matrix.sh, which runs the worst-shaped
  # bundles end to end and fails on five conditions: the object not reaching status
  # "scrubbed", any passthrough, ZERO MATCHES, peak RSS above TARGET_PCT of LIMIT_MIB,
  # or a leaked temp file. The matches gate is the one a memory check cannot replace:
  # a cap set too low stops bounding anything and starts silently emitting unscrubbed
  # files, which looks like a pass if you only watch memory.
  WORKERS: "1"                    # queue concurrency. Kept for config compatibility
                                  # and CLAMPED to 1 -- a higher value is ignored
                                  # (with a warning) because concurrent scrubs on a
                                  # single CPU only slow each other down and would
                                  # multiply the memory budget above.
  QUEUE_MAX: "10000"              # cap on the in-memory pending set. Anything beyond
                                  # it stays in the bucket and is picked up later;
                                  # the service warns when it truncates.
  # How long the in-flight object may sit in ONE phase before the worker starts
  # logging that it may be stalled rather than slow. A log threshold, never a
  # kill: a large bundle legitimately spends minutes in one phase. Pair it with an
  # alert on scrubber_inflight_phase_seconds, which is the same signal as a metric.
  STALL_WARN_AFTER: "5m"
  # The ONLY bound on the scrub itself. Past this, the object is abandoned and
  # FAILS -- no output, no report, and the input is moved aside rather than
  # retried, because a bundle that needs longer than the budget needs longer on
  # every attempt and would otherwise fail forever with the queue behind it.
  #
  # Distinct from STALL_WARN_AFTER above, which only ever writes a log line, and
  # from the transfer timeouts below, which bound object-storage calls and not the
  # work between them. With no timeout at all, one deeply nested bundle held the
  # single consumer for over three hours.
  #
  # Size it from measurement, not patience. The matcher runs at roughly 8 MB/s of
  # expanded content on one unthrottled core and about 3.5 MB/s on a throttled
  # one, so the 4 GiB MAX_EXPAND_BYTES ceiling is a worst case near twenty minutes
  # of real work; an hour leaves room for a slow node. Raise it together with
  # MAX_EXPAND_BYTES, and the startup log warns when the two disagree.
  #
  # "0" removes the bound entirely, which is what shipped before this existed.
  SCRUB_TIMEOUT: "1h"
  # Abandon an object-storage transfer that has moved NO bytes for this long, and
  # bound the metadata calls (10x this for listings, which paginate). This is not
  # a deadline on the transfer: a large object over a congested link legitimately
  # takes minutes, and a deadline generous enough to allow that is too generous to
  # catch a hang. What separates the two is whether anything is still arriving.
  # Without it a connection that goes quiet mid-body blocks the single consumer
  # forever, with the pod live and ready throughout.
  TRANSFER_STALL_TIMEOUT: "60s"
  # Total object-storage time ONE HTTP request may spend, shared by every call it
  # makes. The per-call bound above stops any single call hanging; it says nothing
  # about their sum, and a status poll makes up to three in series while a history
  # page fans out to HISTORY_MAX reads. The browser repeats these every second, so
  # a fast degraded answer beats a slow true one.
  API_STORAGE_BUDGET: "5s"
  # Bound on ONE bucket listing. Separate from the stall timeout because a
  # listing's honest duration scales with the bucket -- it paginates, and the
  # input bucket includes processed/ -- rather than with the network. It used to
  # be derived as 10x the stall timeout, which put it at ten minutes by default:
  # long enough that a dead backend looked idle rather than broken.
  LIST_TIMEOUT: "90s"
  # Withdrawing a package from the queue. The queue is strict FCFS with a single
  # consumer, so one object that cannot make progress holds up everyone behind it;
  # this is the escape hatch, surfaced as a Withdraw button on each upload card.
  #
  # A cancel must present the token /api/uploads minted for that exact key. That
  # is not authentication -- the browser API has none -- but it scopes the endpoint
  # to keys the caller was handed rather than to every key /api/queue and
  # /api/history print.
  ALLOW_CANCEL: "true"
  # Removes that scoping, so ANY caller can withdraw ANY key. This is the operator
  # path for clearing somebody else's stuck object. DO NOT enable it without real
  # authentication in front of the Route: with no auth it is a two-line loop that
  # durably evacuates the queue for every user.
  ALLOW_CANCEL_ANY: "false"
  # Where a withdrawn input is moved under PROCESSED_ACTION=move. Withdrawing does
  # not destroy the upload: it is the user's own copy of logs they were preparing
  # to send out, and the usual reason to withdraw is that it is stuck. Under
  # PROCESSED_ACTION=delete a cancel deletes, honouring your retention policy.
  # Must never be empty -- "" is a prefix of every key, which would make the whole
  # input bucket ineligible and silently stop all scrubbing.
  CANCELLED_PREFIX: "cancelled/"
  # Storage time one cancel may take. Larger than API_STORAGE_BUDGET because the
  # withdrawal is a server-side copy of a possibly large object.
  CANCEL_BUDGET: "60s"
  FINALIZE_GRACE: "15s"           # on shutdown, how long an object that has already
                                  # finished scrubbing may keep writing its output,
                                  # report and digest. Without this a SIGTERM lands
                                  # mid-object and discards a completed scrub, which
                                  # then has to be redone after the restart. Keep it
                                  # inside terminationGracePeriodSeconds below.
  # SCRATCH_BYTES declares how much scratch one object may use. It is the ceiling the
  # expansion cap is derived from, so it is what you change to scrub bigger bundles --
  # but it is one of FOUR statements about the same volume, and they must move
  # together or the pod plans for storage it has not been given:
  #
  #   SCRATCH_BYTES (here)                 what the process sizes its budget from
  #   /work emptyDir sizeLimit             what the kubelet enforces
  #   resources.limits.ephemeral-storage   what the kubelet evicts against
  #   resources.requests.ephemeral-storage what the scheduler reserves on the node
  #
  # Raising the first three and forgetting requests schedules the pod onto a node
  # with the OLD headroom, so it evicts under load rather than failing at rollout.
  #
  # Kubernetes quantities are accepted here (14Gi, 512Mi, 2G) as well as plain byte
  # counts, so this can be written identically to the three declarations below. A
  # value that cannot be read is WARNED about at startup and then ignored -- check
  # scratch_source in the "resource limits" log line if the cap is not what you set.
  #
  # It cannot be detected. An emptyDir's sizeLimit is enforced by the kubelet, not
  # the filesystem, so statfs inside the container reports the whole node's disk and
  # would license a budget that gets the pod evicted. The Downward API can supply it
  # instead (POD_EPHEMERAL_LIMIT, wired in the Deployment) — but ONLY if
  # limits.ephemeral-storage is declared, because Kubernetes silently resolves that
  # reference to the NODE's allocatable storage when the container declares none.
  # Setting SCRATCH_BYTES explicitly here is the belt to that braces; it wins.
  #
  #   MAX_EXPAND_BYTES = SCRATCH_BYTES / 3.5   -> 14Gi gives exactly 4 GiB
  #   MAX_OBJECT_BYTES = 41.7% of that         -> 1707Mi compressed upload
  #
  # Where 3.5 comes from: a .tar.gz holding N bytes of content puts the decompressed
  # tar, the member bodies read out of it, and the repacked result on /work at the
  # same time (3N), plus the staged compressed object. It was 2.5 while the budget
  # double-counted a .tar.gz; the budget now counts content once, so the factor
  # carries the whole multiple. See cmd/scrubberd/main.go scratchFactor.
  SCRATCH_BYTES: "14Gi"           # == the /work sizeLimit AND both
                                  # ephemeral-storage values below. Derives a 4 GiB
                                  # expansion cap. For a different target multiply the
                                  # expanded size you need by 3.5 -- e.g. 6 GiB of
                                  # content needs 21Gi, here and in all three others.
  # MAX_OBJECT_BYTES: "1789569706"  # 1707Mi compressed input, derived. Larger objects
                                  # are turned away and counted in
                                  # scrubber_objects_total{status="too_large"}. Watch
                                  # that counter: it is how you find out real uploads
                                  # are being turned away. (The object is streamed to
                                  # scratch up to the cap PLUS ONE BYTE before being
                                  # refused -- the extra byte is how "exactly at the
                                  # limit" is told from "over it". Not free; just not
                                  # kept.)
  # MAX_EXPAND_BYTES: "4294967296"  # 4Gi of expanded CONTENT per object, derived.
                                  # Enforced *while* reading, so it is a real budget
                                  # rather than a ratio heuristic. Members spill, so
                                  # this is a DISK bound.
                                  # It now means what it says: a .tar.gz used to draw
                                  # on it TWICE (once for the decompressed tar, once
                                  # for the member bodies), so effective capacity was
                                  # half the setting. The container's charge is now
                                  # LENT BACK before the walk descends into it and
                                  # settled afterwards -- lent BEFORE, because the
                                  # remaining budget is also the read ceiling its own
                                  # members must fit under. 4Gi here is now 4Gi of
                                  # real content; measured 2.03x -> 1.03x.
                                  # Set it BELOW the derived value to be more
                                  # conservative; setting it above is what the
                                  # startup scratch warning is for.
  # MAX_LEAF_BYTES: "201326592"     # 192Mi, derived as 96Mi x (limits.memory / 2Gi).
                                  # The largest SINGLE FILE the matcher will scrub.
                                  # This one follows MEMORY, not the volume: the
                                  # matcher needs the payload contiguous as a string,
                                  # and Bytes/Decode/Scrub/Encode each hold a copy
                                  # outside the spill accounting, so one file costs
                                  # 3-4x its size in heap however low SPILL_* is set.
                                  # A larger file is passed through and flagged
                                  # leaf-cap rather than OOM-killing the pod — which
                                  # would otherwise crash-loop, since the restart
                                  # picks the same object up again. 0 disables it.
  # SPILL_THRESHOLD, SPILL_RESIDENT_MAX, MAX_LEAF_BYTES and GOMEMLIMIT are DERIVED
  # from the pod's own memory limit — read from POD_MEMORY_LIMIT (Downward API,
  # wired in the Deployment) and falling back to the cgroup. The values quoted below
  # are the 2Gi values for the two SPILL_* knobs; this pod is 4Gi and derives double
  # those (8Mi / 128Mi). MAX_LEAF_BYTES and GOMEMLIMIT are already quoted at their
  # 4Gi values above and below. Nothing needs editing either way.
  # They are left commented rather than deleted because setting one explicitly
  # is still the override — and note that doing so freezes it: a hard-coded
  # SPILL_RESIDENT_MAX is exactly what stopped the service using a larger pod, and
  # raising it far enough to matter turns spilling off and brings back the OOM the
  # spill exists to prevent. Prefer changing limits.memory.
  # SPILL_THRESHOLD: "4194304"      # 4Mi. Payloads larger than this go to /work on
                                  # their own. Below it they stay on the heap, which
                                  # keeps a 20000-member archive from creating 20000
                                  # files.
  # SPILL_RESIDENT_MAX: "67108864"  # 64Mi aggregate in-memory budget. This is the one
                                  # that catches many-small-members bundles: each
                                  # payload is individually under the threshold while
                                  # together they would hold the whole archive. Once
                                  # this is exceeded everything spills regardless of
                                  # size. THIS and MAX_LEAF_BYTES, not
                                  # MAX_EXPAND_BYTES, are what bound resident memory
                                  # now. (SPILL_RESIDENT_MAX alone does not: the leaf
                                  # the matcher is working on is read back off disk
                                  # outside this accounting, which is why the leaf cap
                                  # exists.)
  SCRUB_FILENAMES: "true"         # also scrub archive member names/paths + output key
  # Reports live in an internal bucket for operators to verify the scrub, so they
  # show the actual original values by default. Set "true" to store salted hashes
  # instead if the reports bucket is less trusted than the operators.
  REDACT_REPORTS: "false"
  MAX_DEPTH: "16"
  MAX_MEMBERS: "100000"
  # MAX_RATIO is gone. An expansion-ratio limit cannot tell a decompression bomb
  # from an ordinary log file (logs routinely compress 200:1 and beyond), and
  # tripping it emitted the object UNSCRUBBED. Use MAX_EXPAND_BYTES instead.
  # Number of past runs the UI may request from /api/history.
  HISTORY_MAX: "100"
  # debug logs a line per file inside every bundle as it is scrubbed.
  # A misconfigured pod does not start. Every fault found at startup -- a missing
  # required variable, an unreadable byte setting, a policy that will not compile, a
  # sizing combination that will evict or OOM the pod -- is collected and reported
  # together as one error naming the value seen and the fix, then the process exits 1.
  #
  # It used to panic on the first missing variable and log.Warn past everything else,
  # so a pod could come up healthy and wrong. If a rollout fails, `oc logs` has the
  # whole list; you do not need to fix them one restart at a time.
  #
  # The two SIZING checks (estimated peak RSS against limits.memory, and scratch needed
  # against the declared volume) rest on estimates that deliberately err high, so they
  # have an escape hatch that parse failures do not:
  # ALLOW_UNSAFE_SIZING: "false"   # "true" downgrades the two sizing faults to
                                  # warnings and starts anyway. Only reasonable if you
                                  # have measured the real peak with
                                  # ./scripts/memory-matrix.sh -- if the estimate was
                                  # right, the pod now dies under load instead of at
                                  # rollout, which is the failure with no report.
  LOG_LEVEL: "info"
  PORT: "8080"
  # Let the Go GC know the container ceiling so it collects harder as it nears it
  # rather than being OOM-killed. Keep this below limits.memory.
  #
  # This is a soft target the GC grows the heap *toward*, so it sets the steady-state
  # RSS as much as it caps it. It only holds while the LIVE set fits underneath: before
  # members spilled, at MAX_EXPAND_BYTES=512Mi the live set exceeded 1600MiB, the GC
  # could not keep up, and RSS overran to 1889Mi -- 92% of the 2Gi pod it was
  # measured on (46% of this one, which is 4Gi).
  #
  # Now that the live set is bounded by the SPILL_* settings rather than by the bundle,
  # the measured peak was 445Mi (22% of a 2Gi limit) at the 1200MiB target that pod
  # derived -- not the 2400MiB below, which is this pod's -- across both
  # worst shapes: 90000 tiny members and a 500Mi incompressible bundle. Those two
  # shapes have no large single member, so they never exercised the leaf path — which
  # is why MAX_LEAF_BYTES had to be introduced from the arithmetic rather than read
  # off that measurement. Re-run ./scripts/memory-matrix.sh after changing either.
  # GOMEMLIMIT: "2400MiB"          # derived as 58.6% of the detected pod memory
                                  # (1200MiB at the 2Gi baseline, doubled for 4Gi)
  # Web UI: browser uploads straight to MinIO via presigned URLs, so the browser
  # must be able to reach MinIO. Set these to MinIO's externally reachable host.
  # (MinIO also needs CORS allowing the scrubber Route origin.)
  MINIO_PUBLIC_ENDPOINT: "<MINIO_PUBLIC_HOST>"
  MINIO_PUBLIC_TLS: "true"
  UPLOAD_EXPIRY: "15m"
  # Allow operators to edit/upload the policy from the UI (PUT /api/policy). Live
  # edits are in-memory only; durable changes go through the scrubber-policies
  # ConfigMap. Set "false" to make the policy read-only from the UI.
  ALLOW_POLICY_EDIT: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrubberd
  labels: { app: scrubberd }
spec:
  replicas: 1            # single replica: the FCFS queue is per-pod, and there is no
                         # distributed object-claim, so two pods would both list the
                         # same bucket and double-process objects.
  # Recreate, NOT the default RollingUpdate. With replicas: 1 the defaults work out
  # to maxSurge=1 / maxUnavailable=0, so a rollout starts the new pod BEFORE
  # terminating the old one -- two scrubberds polling the same input bucket, each
  # with its own queue, for the length of the rollout. Recreate stops the old pod
  # first, at the cost of a short gap in service.
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: scrubberd }
  template:
    metadata:
      labels: { app: scrubberd }
    spec:
      # Long enough for the HTTP drain plus FINALIZE_GRACE, so an object that has
      # finished scrubbing gets its result persisted instead of being killed and
      # redone. The default 30s leaves no room once the server drain is counted.
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: artifactory-pull   # only if pulling from a private Artifactory repo
      containers:
        - name: scrubberd
          # Build this with --build-arg VERSION=0.8.3 so the tag and the version the
          # process reports are the same string. It is surfaced at /api/version, in
          # the scrubber_build_info metric, in the first startup log line and in the
          # UI header -- an unstamped build reports "dev" rather than guessing.
          image: <ARTIFACTORY_DOCKER_HOST>/docker-local/scrubberd:0.8.3
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: scrubber-config }
            - secretRef: { name: scrubber-secret }
          # The resources block below, handed to the process as numbers rather than
          # left to be guessed. This is what makes the caps track this file: change a
          # limit here and the derived caps change on the next rollout.
          #
          # divisor "1" means bytes. Without it the values arrive in the API's default
          # units and the derivation is off by orders of magnitude.
          #
          # containerName is required for resourceFieldRef and must match the
          # container name above.
          #
          # WARNING on limits.ephemeral-storage: if a container declares no
          # ephemeral-storage limit, Kubernetes resolves this reference to the NODE's
          # allocatable storage rather than failing — a number far larger than this
          # pod may use, which would derive an expansion cap that gets it evicted.
          # It is declared below, and SCRATCH_BYTES in the ConfigMap overrides this
          # anyway. Do not remove one without removing the other.
          env:
            - name: POD_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: scrubberd
                  resource: limits.memory
                  divisor: "1"
            - name: POD_EPHEMERAL_LIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: scrubberd
                  resource: limits.ephemeral-storage
                  divisor: "1"
            # CPU, in MILLICORES -- note divisor "1m", not "1". The default divisor
            # is whole cores and it ROUNDS UP, so a container requesting 100m would
            # be handed "1" and the process would believe it had a full core. The
            # value arrives as a bare integer ("100"), which is why the variable
            # names carry the unit.
            #
            # The REQUEST is the one that matters. limits.cpu is the burst ceiling
            # and is what the Go runtime sizes GOMAXPROCS from; requests.cpu is the
            # share the scheduler actually promised, and it is what still holds when
            # the node is busy. A scrub is single-threaded, so one object can never
            # use more than one core however high the limit is -- but it is stretched
            # in proportion to anything below one core. The startup line reports both,
            # plus how long a full-sized bundle should take at the guaranteed rate.
            - name: POD_CPU_REQUEST_MILLI
              valueFrom:
                resourceFieldRef:
                  containerName: scrubberd
                  resource: requests.cpu
                  divisor: "1m"
            - name: POD_CPU_LIMIT_MILLI
              valueFrom:
                resourceFieldRef:
                  containerName: scrubberd
                  resource: limits.cpu
                  divisor: "1m"
          volumeMounts:
            - name: policies
              mountPath: /etc/scrubber/policies
              readOnly: true
            - name: work
              mountPath: /work
            # - name: ca
            #   mountPath: /etc/scrubber/ca
            #   readOnly: true
          # /readyz checks that MinIO is reachable (cached for a few seconds and
          # given its own deadline in-process, so a slow backend cannot make the
          # probe hang).
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # /healthz is a pure liveness signal and does no I/O. The generous
          # timeout and threshold matter: the default 1s timeout is easy to miss
          # while the process is under GC pressure scrubbing a large bundle, and
          # a restart there loses in-flight work.
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            # THIS BLOCK IS THE INPUT TO THE SIZING, not a consequence of it. The
            # caps in the ConfigMap are derived from these numbers via the Downward
            # API above, so this is where you change how much the service can chew.
            #
            #   memory            -> how large one FILE can be scrubbed
            #                        (MAX_LEAF_BYTES = 96Mi x memory/2Gi = 192Mi here)
            #                        and the SPILL_* / GOMEMLIMIT knobs.
            #   ephemeral-storage -> how large a bundle can EXPAND
            #                        (MAX_EXPAND_BYTES = 14Gi / 3.5 = 4Gi here).
            #
            # ephemeral-storage MUST equal the /work sizeLimit at the bottom and
            # SCRATCH_BYTES in the ConfigMap. All three are the same volume; the
            # sizeLimit is what the kubelet enforces, the limit is what the scheduler
            # reserves, and SCRATCH_BYTES is what the process is told.
            #
            # 14Gi is not a typo. A .tar.gz expanding to 4 GiB holds the decompressed
            # tar, the member bodies and the repacked result on /work at once. If the
            # node cannot spare it, lower ephemeral-storage and the expansion cap
            # drops with it. That is the safe direction: a smaller cap means oversized
            # bundles come back flagged and UNSCRUBBED, which you can see and act on,
            # while an undersized volume evicts the pod mid-object with no report at
            # all and re-queues the same object to do it again.
            #
            # The CPU request matters more than it used to: with a single consumer,
            # the queue's drain rate IS the CPU share this pod gets when the node is
            # contended. 100m was conservative when work was spread over several
            # goroutines; now it directly throttles every upload in the queue.
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 14Gi
            limits:
              cpu: "1"
              memory: 4Gi
              ephemeral-storage: 14Gi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: policies
          configMap: { name: scrubber-policies }
        - name: work
          # sizeLimit is load-bearing twice over. Without it an emptyDir draws on node
          # ephemeral storage shared with every other pod, and exceeding it evicts
          # this pod — the same outcome as an OOM, from a different resource. And it
          # is now the number the expansion cap is DERIVED from, so it decides how
          # large a bundle the service will accept.
          #
          # Keep all FOUR in step — this sizeLimit, both ephemeral-storage values
          # above, and SCRATCH_BYTES in the ConfigMap. requests is the one people
          # forget, and it fails late: the scheduler reserves it, so the pod lands on
          # a node with the old headroom and evicts under load rather than at rollout. A .tar.gz stages the decompressed
          # container, the member bodies and the repacked result at once, so the
          # volume must be ~3.5x the expansion cap: 14Gi here for 4Gi of content.
          emptyDir:
            sizeLimit: 14Gi
        # - name: ca
        #   configMap: { name: scrubber-ca }
---
apiVersion: v1
kind: Service
metadata:
  name: scrubberd
  labels: { app: scrubberd }
spec:
  type: ClusterIP
  selector: { app: scrubberd }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# External Route — serves the upload UI (/) + control plane + browser API
# (/api/uploads|status|downloads|policy, /metrics, /healthz, /readyz). The API only
# mints presigned URLs and returns label-only summaries; bundle bytes go directly
# browser <-> MinIO and never traverse this Route.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: scrubberd
  labels: { app: scrubberd }
spec:
  to:
    kind: Service
    name: scrubberd
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
