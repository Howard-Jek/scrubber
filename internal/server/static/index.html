<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scrubber</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/tabler-icons.min.css" />
<style>
  :root{
    --color-background-primary:#ffffff; --color-background-secondary:#f4f2ec; --color-background-tertiary:#eceae1;
    --color-text-primary:#2c2c2a; --color-text-secondary:#5f5e5a; --color-text-tertiary:#888780;
    --color-border-tertiary:rgba(0,0,0,.10); --color-border-secondary:rgba(0,0,0,.16); --color-border-info:#378add;
    --color-text-success:#0f6e56; --color-background-success:#e1f5ee;
    --color-text-info:#185fa5; --color-background-info:#e6f1fb;
    --color-text-danger:#a32d2d;
    --accent:#1d9e75;
    --border-radius-md:8px; --border-radius-lg:12px;
    --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --color-background-primary:#2b2a27; --color-background-secondary:#232220; --color-background-tertiary:#1c1b19;
    --color-text-primary:#f1efe8; --color-text-secondary:#b4b2a9; --color-text-tertiary:#888780;
    --color-border-tertiary:rgba(255,255,255,.12); --color-border-secondary:rgba(255,255,255,.20); --color-border-info:#378add;
    --color-text-success:#5dcaa5; --color-background-success:#123a2f;
    --color-text-info:#85b7eb; --color-background-info:#0f3050;
    --color-text-danger:#f09595;
  }}
  *{box-sizing:border-box;}
  body{margin:0; background:var(--color-background-tertiary); color:var(--color-text-primary); font-family:var(--font-sans); line-height:1.6; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:820px; margin:0 auto; padding:2rem 1rem 4rem;}
  .frame{background:var(--color-background-secondary); border-radius:var(--border-radius-lg); padding:1.5rem;}
  button{font-family:inherit; font-size:13px; color:var(--color-text-primary); background:transparent; border:0.5px solid var(--color-border-secondary); padding:7px 12px; border-radius:var(--border-radius-md); cursor:pointer; transition:.12s;}
  button:hover{background:var(--color-background-secondary);} button:active{transform:scale(.98);}
  .cnt{visibility:hidden; font-size:11px; font-weight:500; color:var(--color-text-success); background:var(--color-background-success); padding:1px 7px; border-radius:999px; min-width:14px; text-align:center;}
  .rule{display:flex; align-items:center; gap:6px; padding:5px 7px; border-radius:var(--border-radius-md); transition:background .4s;}
  .sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);}
  pre{margin:0; white-space:pre-wrap;}
</style>
</head>
<body>
<h1 class="sr">Scrubber — sanitize logs before you share them</h1>
<div class="wrap">
<div class="frame">

  <div style="display:flex; align-items:center; gap:10px; margin-bottom:1.25rem;">
    <div style="width:36px; height:36px; border-radius:var(--border-radius-md); background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); display:flex; align-items:center; justify-content:center;">
      <i class="ti ti-eraser" style="font-size:20px; color:var(--color-text-primary);" aria-hidden="true"></i>
    </div>
    <div>
      <div style="font-size:16px; font-weight:500; color:var(--color-text-primary);">Scrubber</div>
      <div style="font-size:13px; color:var(--color-text-secondary);">Sanitize logs before you share them</div>
    </div>
    <div style="margin-left:auto; display:flex; align-items:center; gap:6px; font-size:12px; color:var(--color-text-secondary); background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); padding:5px 10px; border-radius:var(--border-radius-md);">
      <i class="ti ti-shield-check" style="font-size:15px;" aria-hidden="true"></i> policy: <span id="policyName">default</span>
    </div>
  </div>

  <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start;">

    <div style="flex:2 1 320px; min-width:280px;">
      <div id="drop" role="button" tabindex="0" aria-label="Drop files here or click to browse"
        style="background:var(--color-background-primary); border:1.5px dashed var(--color-border-secondary); border-radius:var(--border-radius-lg); padding:2.25rem 1rem; text-align:center; cursor:pointer; transition:border-color .15s, background .15s;">
        <i class="ti ti-cloud-upload" style="font-size:34px; color:var(--color-text-secondary);" aria-hidden="true"></i>
        <div style="font-size:15px; color:var(--color-text-primary); margin-top:8px;">Drop files here or <span style="color:var(--color-text-info);">click to browse</span></div>
        <div style="font-size:13px; color:var(--color-text-tertiary); margin-top:4px;">Archives, logs, any file — unpacked, scrubbed, repacked</div>
      </div>
      <input type="file" id="picker" multiple class="sr" />
      <div style="display:flex; align-items:center; justify-content:space-between; margin-top:12px;">
        <div style="font-size:12px; color:var(--color-text-tertiary); display:flex; align-items:center; gap:6px;">
          <i class="ti ti-lock" style="font-size:14px;" aria-hidden="true"></i> Bytes go straight to storage
        </div>
        <button id="demo">Load a sample bundle</button>
      </div>
      <div id="list" style="margin-top:1.25rem; display:flex; flex-direction:column; gap:12px;"></div>
    </div>

    <aside style="flex:1 1 230px; min-width:220px; background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:14px;">
      <div style="display:flex; align-items:center; gap:7px; margin-bottom:2px;">
        <i class="ti ti-list-search" style="font-size:17px; color:var(--color-text-secondary);" aria-hidden="true"></i>
        <span style="font-size:14px; font-weight:500; color:var(--color-text-primary);">Active policy</span>
        <span style="margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--color-text-tertiary);">terms.json</span>
      </div>
      <div style="font-size:12px; color:var(--color-text-tertiary); margin-bottom:12px;">What's being picked up</div>
      <div id="policy"></div>
      <button id="viewjson" style="width:100%; font-size:12px; margin-top:12px;"><i class="ti ti-code" style="font-size:14px; vertical-align:-2px; margin-right:5px;" aria-hidden="true"></i>Show terms.json</button>
      <pre id="jsonsrc" style="display:none; margin-top:10px; padding:10px; background:var(--color-background-tertiary); border-radius:var(--border-radius-md); font-family:var(--font-mono); font-size:11px; line-height:1.5; color:var(--color-text-secondary); overflow:auto;"></pre>
    </aside>

  </div>
</div>
</div>

<script>
(function(){
  var drop=document.getElementById('drop'), picker=document.getElementById('picker'),
      list=document.getElementById('list'), policyEl=document.getElementById('policy'),
      demo=document.getElementById('demo');
  var totals={}, labelRows={}, ruleData=[];

  function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

  function loadPolicy(){
    fetch('/api/policy').then(function(r){return r.json();}).then(function(d){
      ruleData=d.rules||[];
      var groups={literal:[],regex:[],preset:[]};
      ruleData.forEach(function(r){ (groups[r.kind]||(groups[r.kind]=[])).push(r); });
      var order=[['literal','Literals'],['regex','Regex'],['preset','Presets']], html='';
      order.forEach(function(g){
        var rows=groups[g[0]]||[]; if(!rows.length) return;
        html+='<div style="font-size:11px; color:var(--color-text-tertiary); margin:10px 0 4px;">'+g[1]+'</div>';
        rows.forEach(function(r){
          html+='<div class="rule" data-label="'+esc(r.label)+'" title="'+esc(r.text)+' → '+esc(r.label)+'">'
            +'<i class="ti ti-point" style="font-size:12px; color:var(--color-text-tertiary);" aria-hidden="true"></i>'
            +'<span style="font-family:var(--font-mono); font-size:12px; color:var(--color-text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0;">'+esc(r.text)+'</span>'
            +'<span style="font-family:var(--font-mono); font-size:11px; color:var(--color-text-tertiary); white-space:nowrap;">'+esc(r.label)+'</span>'
            +'<span class="cnt">0</span></div>';
        });
      });
      policyEl.innerHTML = html || '<div style="font-size:12px;color:var(--color-text-tertiary)">No rules loaded.</div>';
      policyEl.querySelectorAll('.rule').forEach(function(row){ labelRows[row.getAttribute('data-label')]=row; });
      buildJSON();
    }).catch(function(){ policyEl.innerHTML='<div style="font-size:12px;color:var(--color-text-tertiary)">Policy unavailable.</div>'; });
  }

  function buildJSON(){
    var lits=ruleData.filter(function(r){return r.kind==='literal';}).map(function(r){return '    { "value": '+JSON.stringify(r.text)+', "replacement": '+JSON.stringify(r.label)+' }';});
    var rex=ruleData.filter(function(r){return r.kind==='regex';}).map(function(r){return '    { "pattern": '+JSON.stringify(r.text)+', "replacement": '+JSON.stringify(r.label)+' }';});
    var pre=ruleData.filter(function(r){return r.kind==='preset';}).map(function(r){return JSON.stringify(r.text);});
    var parts=[];
    if(lits.length) parts.push('  "literals": [\n'+lits.join(',\n')+'\n  ]');
    if(rex.length) parts.push('  "regex": [\n'+rex.join(',\n')+'\n  ]');
    if(pre.length) parts.push('  "presets": ['+pre.join(', ')+']');
    document.getElementById('jsonsrc').textContent='{\n'+parts.join(',\n')+'\n}';
  }

  function bump(label, n){
    totals[label]=(totals[label]||0)+n;
    var row=labelRows[label]; if(!row) return;
    var c=row.querySelector('.cnt'); c.textContent=totals[label]; c.style.visibility='visible';
    row.style.background='var(--color-background-success)'; setTimeout(function(){row.style.background='transparent';},400);
  }

  function addJob(file){
    var isArch=/\.(zip|tar|gz|tgz|bz2|xz|7z|rar)$/i.test(file.name), start=Date.now();
    var card=document.createElement('div');
    card.style.cssText='background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); padding:14px 16px;';
    card.innerHTML=
      '<div style="display:flex; align-items:center; gap:10px;">'
      +'<i class="ti '+(isArch?'ti-file-zip':'ti-file-text')+'" style="font-size:20px; color:var(--color-text-secondary);" aria-hidden="true"></i>'
      +'<span style="font-family:var(--font-mono); font-size:13px; color:var(--color-text-primary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+esc(file.name)+'</span>'
      +'<span class="st" style="margin-left:auto; font-size:12px; color:var(--color-text-secondary); white-space:nowrap;">Uploading…</span></div>'
      +'<div style="margin-top:10px; height:6px; background:var(--color-background-tertiary); border-radius:999px; overflow:hidden;"><div class="bar" style="height:100%; width:0%; background:var(--accent); border-radius:999px; transition:width .25s;"></div></div>'
      +'<div class="meta" style="display:flex; justify-content:space-between; margin-top:7px; font-size:12px; color:var(--color-text-tertiary);"><span class="pct">0%</span><span class="el">0.0s</span></div>'
      +'<div class="done"></div>';
    list.appendChild(card);
    var bar=card.querySelector('.bar'), st=card.querySelector('.st'), pct=card.querySelector('.pct'),
        elp=card.querySelector('.el'), meta=card.querySelector('.meta'), done=card.querySelector('.done');
    var tick=setInterval(function(){ elp.textContent=((Date.now()-start)/1000).toFixed(1)+'s'; },100);
    function setp(p){ p=Math.round(p); bar.style.width=p+'%'; pct.textContent=p+'%'; }
    function fail(m){ clearInterval(tick); st.innerHTML='<span style="color:var(--color-text-danger)">'+esc(m)+'</span>'; bar.style.background='var(--color-text-danger)'; }

    fetch('/api/uploads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:file.name})})
      .then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(u){
        var xhr=new XMLHttpRequest(); xhr.open('PUT',u.url);
        xhr.upload.onprogress=function(e){ if(e.lengthComputable) setp(e.loaded/e.total*55); };
        xhr.onload=function(){ if(xhr.status>=200&&xhr.status<300){ st.textContent=isArch?'Unpacking…':'Scrubbing…'; setp(60); poll(u.key,60); } else fail('upload failed ('+xhr.status+')'); };
        xhr.onerror=function(){ fail('upload blocked (CORS?)'); };
        xhr.send(file);
      }).catch(function(){ fail('could not start upload'); });

    function poll(key,creep){
      fetch('/api/status?key='+encodeURIComponent(key)).then(function(r){return r.json();}).then(function(s){
        if(s.status==='scrubbed'){ setp(100); finish(s,key); }
        else if(s.status==='error'){ fail(s.error||'processing error'); }
        else { creep=Math.min(95,creep+4); setp(creep); if(isArch&&creep>75) st.textContent='Repacking…'; setTimeout(function(){poll(key,creep);},1200); }
      }).catch(function(){ setTimeout(function(){poll(key,creep);},1500); });
    }

    function finish(s,key){
      clearInterval(tick); meta.style.display='none';
      st.innerHTML='<span style="display:inline-flex; align-items:center; gap:5px; color:var(--color-text-success); background:var(--color-background-success); padding:3px 9px; border-radius:var(--border-radius-md);"><i class="ti ti-check" style="font-size:14px;" aria-hidden="true"></i>Scrubbed in '+((Date.now()-start)/1000).toFixed(1)+'s</span>';
      var bl=s.by_label||{}; Object.keys(bl).forEach(function(l){ bump(l,bl[l]); });
      var chips=Object.keys(bl).map(function(l){return '<span style="font-family:var(--font-mono); font-size:12px; color:var(--color-text-secondary); background:var(--color-background-secondary); padding:3px 8px; border-radius:var(--border-radius-md);">'+esc(l)+' ×'+bl[l]+'</span>';}).join('');
      var cards=[['Matches',s.matches||0],['Bytes in',s.bytes_in||0],['Bytes out',s.bytes_out||0]].map(function(c){
        return '<div style="background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:10px 12px;"><div style="font-size:12px; color:var(--color-text-secondary);">'+c[0]+'</div><div style="font-size:22px; font-weight:500; color:var(--color-text-primary);">'+c[1]+'</div></div>';}).join('');
      done.innerHTML=
        '<div style="display:flex; gap:8px; margin-top:12px;">'
        +'<button class="dl"><i class="ti ti-download" style="font-size:15px; vertical-align:-2px; margin-right:5px;" aria-hidden="true"></i>Download scrubbed</button>'
        +'<button class="rp"><i class="ti ti-file-search" style="font-size:15px; vertical-align:-2px; margin-right:5px;" aria-hidden="true"></i>View report</button></div>'
        +'<div class="panel" style="display:none; margin-top:12px; padding-top:12px; border-top:0.5px solid var(--color-border-tertiary);">'
        +'<div style="display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;">'+cards+'</div>'
        +'<div style="font-size:12px; color:var(--color-text-secondary); margin:12px 0 8px;">Replacements by rule</div>'
        +'<div style="display:flex; flex-wrap:wrap; gap:6px;">'+(chips||'<span style="font-size:12px;color:var(--color-text-tertiary)">no matches</span>')+'</div></div>';
      done.querySelector('.rp').onclick=function(){ var p=done.querySelector('.panel'); p.style.display=p.style.display==='block'?'none':'block'; };
      done.querySelector('.dl').onclick=function(){
        fetch('/api/downloads?key='+encodeURIComponent(key)).then(function(r){return r.json();}).then(function(d){
          var a=document.createElement('a'); a.href=d.url; a.download=''; document.body.appendChild(a); a.click(); a.remove();
        });
      };
    }
  }

  function handle(files){ Array.prototype.forEach.call(files,addJob); }
  drop.onclick=function(){picker.click();};
  drop.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){e.preventDefault();picker.click();} };
  picker.onchange=function(){ handle(picker.files); picker.value=''; };
  ['dragenter','dragover'].forEach(function(ev){ drop.addEventListener(ev,function(e){e.preventDefault(); drop.style.borderColor='var(--color-border-info)'; drop.style.background='var(--color-background-info)';}); });
  ['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev,function(e){e.preventDefault(); drop.style.borderColor='var(--color-border-secondary)'; drop.style.background='var(--color-background-primary)';}); });
  drop.addEventListener('drop',function(e){ if(e.dataTransfer&&e.dataTransfer.files.length) handle(e.dataTransfer.files); });

  demo.onclick=function(){
    var text='2026-07-01 login AcmeCorp user bob@acme.test from 192.168.1.1\n2026-07-01 auth header Bearer eyJabc.def.ghi\n2026-07-01 host db-prod-01.internal.acme.com responded\n';
    handle([new File([text],'sample.log',{type:'text/plain'})]);
  };

  var vj=document.getElementById('viewjson'), src=document.getElementById('jsonsrc');
  vj.onclick=function(){ var open=src.style.display!=='none'; src.style.display=open?'none':'block';
    vj.innerHTML=(open?'<i class="ti ti-code" style="font-size:14px; vertical-align:-2px; margin-right:5px;" aria-hidden="true"></i>Show terms.json':'<i class="ti ti-x" style="font-size:14px; vertical-align:-2px; margin-right:5px;" aria-hidden="true"></i>Hide terms.json'); };

  loadPolicy();
})();
</script>
</body>
</html>
